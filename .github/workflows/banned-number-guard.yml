name: Banned number guard
on:
  push:
    branches: [main]
jobs:
  scrub:
    runs-on: ubuntu-latest
    # Skip runs triggered by the guard's own commit
    if: "!contains(github.event.head_commit.message, 'banned-number guard')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Scrub 908-230-7844 in any format
        run: |
          python3 - <<'PY'
          import re, pathlib
          DASH = r'[\s\.\-‐‑‒–—―−]?'
          pats = [(re.compile(r'\+?1?9082307844'), '+19083173227'),
                  (re.compile(r'\(908\)'+DASH+'230'+DASH+'7844'), '(908) 317-3227'),
                  (re.compile(r'908'+DASH+'230'+DASH+'7844'), '908-317-3227')]
          n=0
          for p in pathlib.Path('.').rglob('*'):
              if p.is_dir() or '.git' in p.parts or 'node_modules' in p.parts: continue
              if p.suffix.lower() not in ('.html','.js','.json','.xml','.md','.txt','.css'): continue
              try: t = p.read_text(encoding='utf-8')
              except Exception: continue
              if '7844' not in t: continue
              o = t
              for rx, rep in pats: t = rx.sub(rep, t)
              if t != o: p.write_text(t, encoding='utf-8'); n += 1
          print('scrubbed', n, 'files')
          PY
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "banned-number-guard"
            git config user.email "guard@users.noreply.github.com"
            git add -A
            git commit -m "banned-number guard: scrub 908-230-7844"
            git push
          fi
