name: Public website SEO baseline
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_portfolio_seo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-website-seo-baseline
          path: seo-audit/
          retention-days: 90
